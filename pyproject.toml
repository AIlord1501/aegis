[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Engineering operations and incident intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "cryptography>=43,<47",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<1.0",
    "pypdf>=5.0,<7.0",
    "pgvector>=0.3,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
